<style>
        .material-symbols-outlined {

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-space-4">
<!-- Suppressed TopNavBar and SideNavBar because this is a transactional flow (Password Reset) -->
<main class="w-full max-w-[440px]">
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-space-8 shadow-sm">
<!-- Header Section -->
<div class="text-center mb-space-8">
<div class="inline-flex items-center justify-center w-space-12 h-space-12 rounded-full bg-primary-fixed text-primary mb-space-4">
<span class="material-symbols-outlined text-headline-xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-space-2">Set new password</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please choose a strong password that you haven't used before.</p>
</div>
<!-- Form Section -->
<form class="space-y-space-6" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="space-y-space-4">
<!-- New Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-space-1" for="new-password">New Password</label>
<div class="relative">
<input class="w-full px-space-3 py-2 border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="new-password" name="new-password" placeholder="Enter new password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-space-3 flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-space-1" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="w-full px-space-3 py-2 border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="confirm-password" name="confirm-password" placeholder="Re-enter new password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-space-3 flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Security Checklist -->
<div class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-space-4 space-y-space-2">
<p class="font-label-sm text-label-sm text-on-surface uppercase tracking-wider mb-space-2">Password Requirements</p>
<ul class="space-y-space-1">
<li class="flex items-center space-x-space-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">check_circle</span>
<span class="font-body-sm text-body-sm">At least 8 characters long</span>
</li>
<li class="flex items-center space-x-space-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">check_circle</span>
<span class="font-body-sm text-body-sm">Contains an uppercase letter</span>
</li>
<li class="flex items-center space-x-space-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">check_circle</span>
<span class="font-body-sm text-body-sm">Contains a number or symbol</span>
</li>
</ul>
</div>
<!-- Submit Action -->
<button class="w-full py-2 px-space-4 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors flex justify-center items-center space-x-space-2" type="submit">
<span>Reset Password &amp; Sign In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-space-6 text-center">
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors flex items-center justify-center space-x-space-1" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Back to Login</span>
</a>
</div>
</div>
<!-- Footer Branding -->
<div class="text-center mt-space-8">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider font-bold">Karma SaaS</p>
</div>
</main>
