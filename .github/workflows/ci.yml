name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 4000
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL: postgresql://postgres.btssglzvntecsualtpnm:KarmaSchool123%40@aws-1-eu-west-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1
      DIRECT_URL: postgresql://postgres.btssglzvntecsualtpnm:KarmaSchool123%40@aws-1-eu-west-1.pooler.supabase.com:5432/postgres
      BETTER_AUTH_SECRET: test-better-auth-secret-min-32-chars-long-1234567890
      BETTER_AUTH_URL: http://localhost:4000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:4000
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      ENABLE_DEMO_LOGIN: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
